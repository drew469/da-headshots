    fadeUp(h1,t,.05,.3,40); fadeUp(h1s,t,.45,.3);

const cardN=div('card','<img src="logos/nfl-ne.png" style="width:150px;height:150px;object-fit:contain;vertical-align:middle"><div class="osw" style="font-size:30px;letter-spacing:2px;color:#050506">NEW ENGLAND PATRIOTS</div><div class="big num" style="font-size:150px;color:#050506">1643</div>',E1,{left:'70px',top:'700px',background:'var(--cy)',width:'300px',textAlign:'center'});
