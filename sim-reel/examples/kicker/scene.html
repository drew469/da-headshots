/* ---------- side-view football field ---------- */
const YD=8.6, PX=yd=>1000-yd*YD;   // yards from the goalposts -> x
function field(parent,gy,{lbl=true}={}){

  for(let s=0;s<10;s++)sv('rect',{x:PX(10+(s+1)*10),y:gy,width:10*YD,height:70,fill:s%2?'#1C5E2E':'#226B36'},g);
  sv('rect',{x:PX(10),y:gy,width:10*YD,height:70,fill:'#0E3F1D'},g);
  for(let y=10;y<=110;y+=5){sv('line',{x1:PX(y),x2:PX(y),y1:gy,y2:gy+(y%10?22:70),stroke:'#fff','stroke-width':y==10||y==110?5:3,opacity:.85},g);}
  if(lbl)for(let y=20;y<=100;y+=10){const n=y<=60?y-10:110-y; const tx=sv('text',{x:PX(y),y:gy+56,'text-anchor':'middle','font-size':26,fill:'#fff',style:'font-family:Anton'},g); tx.textContent=n;}
  // goalpost (exaggerated height for readability)
  const gp=sv('g',{},g); sv('line',{x1:PX(0),x2:PX(0),y1:gy,y2:gy-120,stroke:'#F2C14E','stroke-width':9},gp);
  sv('line',{x1:PX(0)-34,x2:PX(0)+34,y1:gy-120,y2:gy-120,stroke:'#F2C14E','stroke-width':9},gp);
  sv('line',{x1:PX(0)-34,x2:PX(0)-34,y1:gy-120,y2:gy-330,stroke:'#F2C14E','stroke-width':8},gp);
  sv('line',{x1:PX(0)+34,x2:PX(0)+34,y1:gy-120,y2:gy-330,stroke:'#F2C14E','stroke-width':8},gp);
  const arc=sv('path',{fill:'none',stroke:'#0CF5F9','stroke-width':5,'stroke-dasharray':'2 12','stroke-linecap':'round'},g);
  const ball=sv('ellipse',{rx:13,ry:8,fill:'#8B4A1F',stroke:'#fff','stroke-width':2},g);
  const spot=sv('g',{},g); sv('line',{x1:0,x2:0,y1:0,y2:-50,stroke:'#FF4B3E','stroke-width':4},spot); sv('polygon',{points:'0,-50 30,-40 0,-30',fill:'#FF4B3E'},spot);
  const spotT=sv('text',{x:0,y:-62,'text-anchor':'middle','font-size':34,fill:'#fff',style:'font-family:Anton'},spot);
  // kicker figure
  const kk=sv('g',{},g); sv('circle',{cx:0,cy:-70,r:11,fill:'#fff'},kk); sv('line',{x1:0,y1:-58,x2:0,y2:-28,stroke:'#fff','stroke-width':7,'stroke-linecap':'round'},kk);
  sv('line',{x1:0,y1:-50,x2:-16,y2:-36,stroke:'#fff','stroke-width':6,'stroke-linecap':'round'},kk); sv('line',{x1:0,y1:-50,x2:16,y2:-40,stroke:'#fff','stroke-width':6,'stroke-linecap':'round'},kk);
  sv('line',{x1:0,y1:-28,x2:-8,y2:0,stroke:'#fff','stroke-width':7,'stroke-linecap':'round'},kk); const leg=sv('line',{x1:0,y1:-28,x2:18,y2:-4,stroke:'#fff','stroke-width':7,'stroke-linecap':'round'},kk);

    const x0=PX(d), x1=make?PX(-6):PX(Math.max(0,d-reach)), H=make?Math.max(330,150+d*3.2):150+reach*2.6;
    const pts=[]; const n=60; for(let i=0;i<=n*p;i++){const s=i/n; pts.push((i?'L':'M')+lerp(x0,x1,s).toFixed(1)+','+(gy-4*H*s*(1-s)).toFixed(1));}
    set(arc,{d:pts.join(''),stroke:col}); const s=p; set(ball,{cx:lerp(x0,x1,s),cy:gy-4*H*s*(1-s)-6,transform:`rotate(${p*720} ${lerp(x0,x1,s)} ${gy-4*H*s*(1-s)-6})`});
    set(spot,{transform:`translate(${x0} ${gy})`}); spotT.textContent=label?d:''; set(kk,{transform:`translate(${x0-30} ${gy}) scale(1.7)`});

/* ---------- 0 HOOK ---------- */
const H=CH[0], Hs=H._svg;

function rHook(t){

  else if(c){FH.kick(100,eOut(prog(t,C(7)-.1,C(7)+1.2)),{col:'#0CF5F9'});}

sfx(C(6)-.05,'whoosh',.45); sfx(C(7)-.1,'riser',.4,1.3); sfx(C(7)+1.2,'thump',.85); sfx(C(8)-.05,'thump',.6); sfx(C(8)+.3,'boing',.4);

const los=sv('g',{},S1); sv('line',{x1:PX(93),x2:PX(93),y1:1150,y2:780,stroke:'#0CF5F9','stroke-width':4,'stroke-dasharray':'10 8'},los);

mk.innerHTML=`<div class="osw mut" style="font-size:30px;letter-spacing:2px">MADE FROM 55–59 YARDS</div>
