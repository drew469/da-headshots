<body><div id="stage">

</div>

<script src="timing.js"></script>
<script>
/* ===================== helpers (pure functions of t) ===================== */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,p)=>a+(b-a)*p, prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=p=>1-Math.pow(1-p,3), eIn=p=>p*p*p, eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
function rng(s){s=s>>>0||1;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296;}
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs={},parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
function set(n,a){for(const k in a)n.setAttribute(k,a[k]);return n;}
function div(cls,html,parent,style={}){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style);parent.appendChild(d);return d;}
const C=i=>CUES[i].a;
const WT=(w,after=0)=>WORDS.find(x=>x.w.toLowerCase().startsWith(w.toLowerCase())&&x.a>=after).a;
function popIn(el,t,t0,{dur=.28,from=.4,y=0}={}){const p=prog(t,t0,t0+dur);el.style.opacity=p>0?Math.min(1,p*3):0;el.style.transform=`translateY(${(1-eOut(p))*y}px) scale(${from+(1-from)*back(p)})`;return p;}
function fadeUp(el,t,t0,dur=.3,dy=30){const p=eOut(prog(t,t0,t0+dur));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;return p;}
const show=(els,on)=>els.forEach(e=>e.style.display=on?(e instanceof SVGElement?'inline':'block'):'none');
const LG=id=>`logos/ncaa-${id}.png`;
const L={umbc:2378,uva:258,fdu:161,pur:2509,duke:150,siena:2561,ksu:2306,fau:2226};
const SFX=[]; const sfx=(t,type,gain=.5,dur)=>SFX.push(dur?{t,type,gain,dur}:{t,type,gain});
const seedH=(n,sz,bg)=>`<span class="seed" style="width:${sz}px;height:${sz}px;font-size:${sz*.56}px;background:${bg||(n==16?'var(--rd)':n==1?'var(--cy)':'#fff')};color:${n==16?'#fff':'#050506'}">${n}</span>`;
const logoH=(id,sz)=>`<img class="lg" src="${LG(id)}" style="width:${sz}px;height:${sz}px">`;
/* basketball + trophy drawings */
function ball(parent,r=30){const g=sv('g',{},parent);sv('circle',{r,fill:'#F58426',stroke:'#2a1406','stroke-width':r*.08},g);
  [`M${-r},0 L${r},0`,`M0,${-r} L0,${r}`].forEach(d=>sv('path',{d,stroke:'#2a1406','stroke-width':r*.07,fill:'none'},g));
  sv('path',{d:`M${-r*.7},${-r*.7} Q0,0 ${-r*.7},${r*.7}`,stroke:'#2a1406','stroke-width':r*.07,fill:'none'},g);
  sv('path',{d:`M${r*.7},${-r*.7} Q0,0 ${r*.7},${r*.7}`,stroke:'#2a1406','stroke-width':r*.07,fill:'none'},g);return g;}
function trophy(parent,sc=1,col='#F2C14E'){const g=sv('g',{},parent);
  sv('path',{d:'M-40,120 L40,120 L32,98 L-32,98 Z',fill:'#6B4A2B',stroke:'#050506','stroke-width':3},g);
  sv('path',{d:'M-12,98 L12,98 L8,40 L-8,40 Z',fill:col,stroke:'#050506','stroke-width':3},g);
  sv('path',{d:'M-46,-30 L46,-30 Q44,40 0,46 Q-44,40 -46,-30 Z',fill:col,stroke:'#050506','stroke-width':3},g);
  sv('path',{d:'M-46,-18 Q-74,-14 -62,12 Q-54,26 -36,22',fill:'none',stroke:col,'stroke-width':7},g);
  sv('path',{d:'M46,-18 Q74,-14 62,12 Q54,26 36,22',fill:'none',stroke:col,'stroke-width':7},g);
  const b=ball(g,26); set(b,{transform:'translate(0 -58)'}); set(g,{transform:`scale(${sc})`}); return g;}
/* 64-team bracket (lines), revealed by p in round order */
function bracket(parent,x0,x1,y0,y1){const g=sv('g',{},parent),L=[];const cw=(x1-x0)/12;
  for(const side of [0,1]){for(let r=0;r<6;r++){const n=32>>r, h=(y1-y0)/n;
    for(let i=0;i<n;i++){const y=y0+h*(i+.5), xa=side?x1-r*cw:x0+r*cw, xb=side?xa-cw:xa+cw;
      L.push({e:sv('line',{x1:xa,y1:y,x2:xb,y2:y,stroke:'#3A3A44','stroke-width':3},g),r});
      if(i%2==0&&r<5){const y2=y0+h*(i+1.5); L.push({e:sv('line',{x1:xb,y1:y,x2:xb,y2:y2,stroke:'#3A3A44','stroke-width':3},g),r});}}}}
  const ctr=sv('rect',{x:(x0+x1)/2-cw*.9,y:(y0+y1)/2-28,width:cw*1.8,height:56,rx:10,fill:'none',stroke:'#0CF5F9','stroke-width':4},g);
  return {g,L,ctr,draw(p){L.forEach(l=>{const q=clamp(p*6-l.r);set(l.e,{opacity:q>0?1:0,stroke:q>=1&&l.r<1?'#55555F':'#3A3A44'});}); set(ctr,{opacity:clamp(p*6-5.5)*2});}};}

/* ===================== chapters ===================== */
const NL=ab=>`logos/nfl-${ab.toLowerCase()}.png`;
const nlH=(ab,sz)=>`<img class="lg" src="${NL(ab)}" style="width:${sz}px;height:${sz}px">`;
const CUT=[0, C(8)-.05, C(12)-.05, C(15)-.05, C(21)-.05, C(27)-.05, C(34)-.05, C(41)-.05, C(45)-.05];
const END=82.55;
const T={end:END};
const HDR=[null,
 ['01','Every team gets a score.','it’s called Elo · like a chess rating'],
 ['02','From gap to chance.','the bigger the gap, the bigger the chance'],
 ['03','Replay every run.','15 playoff trips · 27 games · 14-13'],
 ['04','Is it honest?','270 real playoff games · 1999–2022'],
 ['05','100,000 careers.','rings per simulated Peyton career'],
 ['06','The heartbreak.','title chance going into each playoff run'],
 ['07','Should vs. did.','playoff wins · model vs real life'],
 ['08','Now compare Brady.','expected rings vs real rings']];
const chs=document.getElementById('chs');
const prg=document.getElementById('prog'); for(let i=0;i<8;i++){const x=document.createElement('i');prg.appendChild(x);}
const CH=[]; for(let i=0;i<CUT.length;i++){const d=div('ch','',chs);CH.push(d);
  if(HDR[i]){const h=div('hdr',`<div class="n">${HDR[i][0]}</div><div class="t">${HDR[i][1]}</div><div class="s">${HDR[i][2]}</div>`,d);d._h=h;}
  const s=sv('svg',{width:1080,height:1920,viewBox:'0 0 1080 1920',style:'position:absolute;left:0;top:0'});d.appendChild(s);d._svg=s;}
CUT.slice(1).forEach(c=>{sfx(c-.18,'whip',.55);});
const hdrIn=(k,t)=>{if(CH[k]._h)fadeUp(CH[k]._h,t,CUT[k]+.05,.3);};
function trophy(parent,sc=1){const g=sv('g',{},parent);
  sv('path',{d:'M-34,120 L34,120 L26,96 L-26,96 Z',fill:'#BFC4CC',stroke:'#050506','stroke-width':3},g);
  sv('path',{d:'M-14,96 L14,96 L8,20 L-8,20 Z',fill:'#D9DDE3',stroke:'#050506','stroke-width':3},g);
  sv('ellipse',{cx:0,cy:-22,rx:24,ry:42,transform:'rotate(28)',fill:'#E6E9EE',stroke:'#050506','stroke-width':3},g);
  set(g,{transform:`scale(${sc})`}); return g;}

/* ---------- 0 HOOK ---------- */
const H=CH[0], Hs=H._svg;
const hCirc=div('abs','',H,{left:'320px',top:'700px',width:'660px',height:'660px',borderRadius:'50%',background:'#002C5F',boxShadow:'inset 0 0 0 12px #A2AAAD'});
const hWm=div('abs','',H,{left:'440px',top:'820px',width:'420px',height:'420px',background:`url(${NL('ind')}) center/contain no-repeat`,opacity:.16});
const hSt=div('abs','',H,{left:'420px',top:'640px',width:'460px',height:'780px',background:'url(img/st_pm_colts.png) center bottom/contain no-repeat'});
const h1=div('abs big','PEYTON MANNING:<br><span class="cy">2 RINGS.</span>',H,{left:'54px',top:'292px',fontSize:'118px'});
const h1s=div('abs osw','<span class="cy">5 MVPs</span> · I simulated his career <span class="cy">100,000</span> times',H,{left:'58px',top:'552px',fontSize:'36px'});
const hL=div('abs','',H,{left:'60px',top:'760px'}); hL.innerHTML=`<div style="display:flex;flex-direction:column;gap:20px;align-items:center">${nlH('ind',170)}${nlH('den',170)}</div>`;
const hMk=div('abs mk cy','rings: 2',H,{left:'60px',top:'1200px',fontSize:'78px'});
const hA=div('abs','',H,{left:'0',right:'0',top:'330px',textAlign:'center'}); hA.innerHTML='<div class="osw mut" style="font-size:42px;letter-spacing:4px">THE AVERAGE PEYTON WINS</div><div class="big cy num" style="font-size:420px;line-height:1">0</div><div class="osw" style="font-size:48px;letter-spacing:4px">RINGS</div>';
const TR=[0,1].map(()=>trophy(Hs,1.4)); const halfClip=sv('rect',{x:0,y:-60,width:0,height:200,fill:'#050506'},Hs);
const hQ=div('abs big','SO WAS HE<br><span class="cy">UNLUCKY?</span>',H,{left:'54px',top:'300px',fontSize:'170px'});
const hN=div('pill','NOT EVEN CLOSE.',H,{left:'90px',top:'720px',background:'var(--rd)',color:'#fff',fontSize:'64px'});
const hD=div('abs','',H,{left:'520px',top:'820px',width:'520px',height:'640px',background:'url(img/st_pm_den.png) center bottom/contain no-repeat'});
function rHook(t){
  const a=t<C(4)-.05; show([hCirc,hWm,hSt,h1,h1s,hL,hMk],a);
  if(a){const pc=back(prog(t,.02,.42)); hCirc.style.transform=`scale(${Math.max(0,pc)})`; hWm.style.transform=hCirc.style.transform; hWm.style.opacity=.16*prog(t,.2,.5);
    const ps=eOut(prog(t,.12,.6)); hSt.style.transform=`translateY(${(1-ps)*420}px) scale(${1+t*.012})`; hSt.style.opacity=ps>0?1:0;
    fadeUp(h1,t,.05,.3,40); fadeUp(h1s,t,C(1)-.05,.3); popIn(hL,t,.6,{from:.3}); popIn(hMk,t,C(2)+.1,{from:1.3}); hMk.style.transform+=' rotate(-8deg)';}
  const b=t>=C(4)-.05&&t<C(5)-.05; show([hA],b); TR.forEach(x=>x.style.display=b?'inline':'none'); halfClip.style.display=b?'inline':'none';
  if(b){fadeUp(hA,t,C(4)-.05,.25); const v=1.5*eOut(prog(t,C(4)+.2,C(4)+1.4)); hA.querySelector('.num').textContent=v.toFixed(1);
    TR.forEach((x,i)=>{const p=back(prog(t,C(4)+.5+i*.3,C(4)+.8+i*.3)); set(x,{transform:`translate(${430+i*220} 1150) scale(${1.4*Math.max(0,p)})`});});
    set(halfClip,{x:650,y:1040,width:t>=C(4)+1.3?120:0,height:240});}
  const c=t>=C(5)-.05; show([hQ],c); show([hN,hD],c&&t>=C(6)-.05);
  if(c){popIn(hQ,t,C(5)-.05,{from:1.15}); popIn(hN,t,C(6)-.05,{from:1.5}); const p=eOut(prog(t,C(6),C(6)+.4)); hD.style.transform=`translateX(${(1-p)*500}px)`;}
}
sfx(.05,'whoosh',.5); sfx(.25,'thump',.6); sfx(.6,'pop',.45); sfx(C(2)+.1,'thump',.5); sfx(C(4)-.05,'whoosh',.45); sfx(C(4)+.5,'ding',.25); sfx(C(4)+.8,'ding',.25); sfx(C(4)+1.3,'squish',.35);
sfx(C(5)-.05,'whoosh',.45); sfx(C(6)-.05,'thump',.85); sfx(C(6),'whoosh',.35);

/* ---------- 1 ELO ---------- */
const E1=CH[1];
const cardI=div('card','',E1,{left:'60px',top:'630px',width:'440px',background:'#0E0E12',border:'4px solid #002C5F',textAlign:'center'}); cardI.innerHTML=`${nlH('ind',160)}<div class="osw mut" style="font-size:26px;letter-spacing:2px;margin-top:6px">COLTS</div><div class="big num" style="font-size:110px">1696</div>`;
const cardN=div('card','',E1,{left:'580px',top:'630px',width:'440px',background:'#0E0E12',border:'4px solid #26262C',textAlign:'center'}); cardN.innerHTML=`${nlH('ne',160)}<div class="osw mut" style="font-size:26px;letter-spacing:2px;margin-top:6px">PATRIOTS</div><div class="big num" style="font-size:110px">1710</div>`;
const gm1=div('abs osw mut','2006 AFC TITLE GAME · RATINGS BEFORE KICKOFF',E1,{left:'60px',top:'560px',fontSize:'30px',letterSpacing:'2px'});
const vs1=div('abs big mut','VS',E1,{left:'0',right:'0',top:'800px',textAlign:'center',fontSize:'70px'});
const up1=div('pill','WIN → ▲',E1,{left:'150px',top:'1080px',background:'var(--cy)',color:'#050506',fontSize:'40px'});
const dn1=div('pill','LOSE → ▼',E1,{left:'660px',top:'1080px',background:'var(--rd)',color:'#fff',fontSize:'40px'});
function r1(t){hdrIn(1,t); show([cardI,cardN,vs1,gm1],true); fadeUp(gm1,t,CUT[1]+.1); popIn(cardI,t,CUT[1]+.2,{from:.6}); popIn(cardN,t,CUT[1]+.4,{from:.6});
  const n1=cardI.querySelector('.num'), n2=cardN.querySelector('.num');
  const g=t>=C(10)?eOut(prog(t,C(10),C(10)+.6)):0, l=t>=C(11)?eOut(prog(t,C(11),C(11)+.6)):0;
  n1.textContent=Math.round(1696+13*g); n2.textContent=Math.round(1710-13*g); n1.style.color=g>0?'var(--cy)':'#fff'; n2.style.color=g>0?'var(--rd)':'#fff';
  show([up1],t>=C(10)-.05); popIn(up1,t,C(10)-.05,{from:.5}); show([dn1],t>=C(11)-.05); popIn(dn1,t,C(11)-.05,{from:.5});
  E1.style.transform=`scale(${1+(t-CUT[1])*.002})`;}
sfx(CUT[1]+.2,'pop',.4); sfx(CUT[1]+.4,'pop',.4); sfx(C(10)-.05,'ding',.3); sfx(C(11)-.05,'thump',.5);

/* ---------- 2 GAP -> CHANCE ---------- */
const E2=CH[2], S2=E2._svg;
const gx0=140,gx1=960,gy0=1240,gy1=640; const gxm=d=>gx0+(d+400)/800*(gx1-gx0), gym=p=>gy0-p*(gy0-gy1);
const ax2=sv('g',{},S2); [0,.25,.5,.75,1].forEach(v=>{sv('line',{x1:gx0,x2:gx1,y1:gym(v),y2:gym(v),stroke:'#1E1E24','stroke-width':2},ax2); const tx=sv('text',{x:gx0-14,y:gym(v)+8,'text-anchor':'end','font-size':24,fill:'#6A6A72'},ax2); tx.textContent=Math.round(v*100)+'%';});
[['← WEAKER',-400],['EVENLY MATCHED',0],['STRONGER →',400]].forEach(([s,d])=>{const tx=sv('text',{x:gxm(d),y:gy0+40,'text-anchor':d<0?'start':d>0?'end':'middle','font-size':24,fill:'#6A6A72'},ax2); tx.textContent=s;});
const cv2=sv('path',{fill:'none',stroke:'#fff','stroke-width':8,'stroke-linecap':'round'},S2);
const dot2=sv('circle',{r:16,fill:'#0CF5F9'},S2);
const pr=d=>1/(1+Math.pow(10,-d/400));
const lab2=div('abs','',E2,{left:'60px',top:'1300px'});
function r2(t){hdrIn(2,t); set(ax2,{opacity:prog(t,CUT[2]+.1,CUT[2]+.4)});
  const p=eIO(prog(t,CUT[2]+.2,C(13)+.4)); let d=''; for(let x=-400;x<=-400+800*p;x+=8)d+=(d?'L':'M')+gxm(x)+','+gym(pr(x)); set(cv2,{d});
  const gap=t>=C(14)-.05?-15+65*eOut(prog(t,C(14)-.05,C(14)+.5)):-15*eOut(prog(t,C(13),C(13)+.6)); set(dot2,{cx:gxm(gap),cy:gym(pr(gap)),opacity:t>=C(13)?1:0});
  lab2.style.display=t>=C(13)?'block':'none'; lab2.innerHTML=`<span class="osw" style="font-size:40px">${nlH('ind',70)} <span style="vertical-align:middle">${gap>=0?'+':''}${Math.round(gap)} ELO → <span class="cy">${Math.round(pr(gap)*100)}%</span>${t>=C(14)-.05?' <span class="mut">(HOME +65)</span>':''}</span></span>`;
  E2.style.transform=`scale(${1+(t-CUT[2])*.002})`;}
sfx(CUT[2]+.2,'whoosh',.3); sfx(C(13),'pop',.45); sfx(C(14)-.05,'ding',.35);

/* ---------- 3 REPLAY: 27-game wall ---------- */
const E3=CH[3]; const GM=DATA.games;
const WALL=GM.map((g,i)=>{const d=div('abs','',E3,{left:(54+(i%6)*164)+'px',top:(540+Math.floor(i/6)*150)+'px',width:'152px',height:'140px',borderRadius:'14px',background:'#101014',boxSizing:'border-box',border:'4px solid #26262C',textAlign:'center'});
  d.innerHTML=`<div class="osw mut" style="font-size:19px;margin-top:4px">’${String(g.s).slice(2)} ${g.r} · ${Math.round(g.p*100)}%</div><img src="${NL(g.o)}" style="width:62px;height:62px;object-fit:contain"><div class="big" style="font-size:30px">${g.w?'W':'L'} ${g.sc}</div>`; return {d,g};});
