sfx(CUT[8]+.1,'whoosh',.45); sfx(WTs('coin',K.c8)-.1,'thump',.75); sfx(K.poll-.05,'whoosh',.5); sfx(K.poll+.3,'pop',.5); sfx(K.poll+.65,'pop',.5); sfx(CUES[CUES.length-1].a,'sparkle',.4);
const RF=[rHook,rRost,rEra,rScale,rHon,rCta,rRun,rHome,rVer];

/* ---------- captions ---------- */
const cap=document.getElementById('cap');
const isNum=w=>/\d/.test(w)||/^(FOLLOW|DAILY|ATHLETE|BULLS|WARRIORS)$/i.test(w.replace(/[.,?:]/g,''));
function rCap(t){
  if(t<CT('I simulated the series')-.02){cap.innerHTML='';return;}
  let i=CUES.findIndex((c,k)=>t>=c.a-.02&&t<(CUES[k+1]?CUES[k+1].a-.02:END)); if(i<0){cap.innerHTML='';return;}
  const c=CUES[i], ws=c.text.split(' '), dur=Math.max(.3,c.b-c.a);
  const tot=ws.reduce((s,w)=>s+w.length+1,0); let acc=0;
  cap.innerHTML=ws.map(w=>{const st=c.a+acc/tot*dur; acc+=w.length+1; const on=t>=st-.03; const p=eOut(prog(t,st-.03,st+.09));
    const col=on?(isNum(w)?'var(--cy)':'#fff'):'rgba(255,255,255,.28)';
    return `<span style="color:${col};transform:scale(${on?1+.12*(1-p):1})">${w}</span>`;}).join(' ');
}

/* ---------- master render ---------- */
function render(t){
  let k=0; for(let i=0;i<CUT.length;i++)if(t>=CUT[i])k=i;
  CH.forEach((c,i)=>c.style.display=i===k?'block':'none');

  CH[k].style.opacity=Math.min(1,(k?.3+.7*wIn:1))*(1-.5*wOut);
  CH[k].style.transform=(CH[k].style.transform||'')+` scale(${1+(k?(1-eOut(wIn))*.04:0)+eIn(wOut)*.05})`;
  const NUM=HDR.slice(1,k+1).filter(Boolean).length; [...prg.children].forEach((x,i)=>x.className=k&&i<NUM?'on':'');
  prg.style.opacity=k?1:0;
  bgfx(t,k);
  rCap(t);
}
