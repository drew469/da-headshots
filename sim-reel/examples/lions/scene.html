<script>
/* ===================== helpers (pure functions of t) ===================== */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,p)=>a+(b-a)*p, prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=p=>1-Math.pow(1-p,3), eIn=p=>p*p*p, eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
function rng(s){s=s>>>0||1;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296;}
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs={},parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
function set(n,a){for(const k in a)n.setAttribute(k,a[k]);return n;}
function div(cls,html,parent,style={}){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style);parent.appendChild(d);return d;}
const C=i=>CUES[i].a;
const WT=(w,after=0)=>WORDS.find(x=>x.w.toLowerCase().startsWith(w.toLowerCase())&&x.a>=after).a;
function popIn(el,t,t0,{dur=.28,from=.4,y=0}={}){const p=prog(t,t0,t0+dur);el.style.opacity=p>0?Math.min(1,p*3):0;el.style.transform=`translateY(${(1-eOut(p))*y}px) scale(${from+(1-from)*back(p)})`;return p;}
function fadeUp(el,t,t0,dur=.3,dy=30){const p=eOut(prog(t,t0,t0+dur));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;return p;}
const show=(els,on)=>els.forEach(e=>e.style.display=on?(e instanceof SVGElement?'inline':'block'):'none');
const LG=id=>`logos/ncaa-${id}.png`;
const L={umbc:2378,uva:258,fdu:161,pur:2509,duke:150,siena:2561,ksu:2306,fau:2226};
const SFX=[]; const sfx=(t,type,gain=.5,dur)=>SFX.push(dur?{t,type,gain,dur}:{t,type,gain});
const seedH=(n,sz,bg)=>`<span class="seed" style="width:${sz}px;height:${sz}px;font-size:${sz*.56}px;background:${bg||(n==16?'var(--rd)':n==1?'var(--cy)':'#fff')};color:${n==16?'#fff':'#050506'}">${n}</span>`;
const logoH=(id,sz)=>`<img class="lg" src="${LG(id)}" style="width:${sz}px;height:${sz}px">`;
/* basketball + trophy drawings */
function ball(parent,r=30){const g=sv('g',{},parent);sv('circle',{r,fill:'#F58426',stroke:'#2a1406','stroke-width':r*.08},g);
  [`M${-r},0 L${r},0`,`M0,${-r} L0,${r}`].forEach(d=>sv('path',{d,stroke:'#2a1406','stroke-width':r*.07,fill:'none'},g));
  sv('path',{d:`M${-r*.7},${-r*.7} Q0,0 ${-r*.7},${r*.7}`,stroke:'#2a1406','stroke-width':r*.07,fill:'none'},g);
  sv('path',{d:`M${r*.7},${-r*.7} Q0,0 ${r*.7},${r*.7}`,stroke:'#2a1406','stroke-width':r*.07,fill:'none'},g);return g;}
function trophy(parent,sc=1,col='#F2C14E'){const g=sv('g',{},parent);
  sv('path',{d:'M-40,120 L40,120 L32,98 L-32,98 Z',fill:'#6B4A2B',stroke:'#050506','stroke-width':3},g);
  sv('path',{d:'M-12,98 L12,98 L8,40 L-8,40 Z',fill:col,stroke:'#050506','stroke-width':3},g);
  sv('path',{d:'M-46,-30 L46,-30 Q44,40 0,46 Q-44,40 -46,-30 Z',fill:col,stroke:'#050506','stroke-width':3},g);
  sv('path',{d:'M-46,-18 Q-74,-14 -62,12 Q-54,26 -36,22',fill:'none',stroke:col,'stroke-width':7},g);
  sv('path',{d:'M46,-18 Q74,-14 62,12 Q54,26 36,22',fill:'none',stroke:col,'stroke-width':7},g);
  const b=ball(g,26); set(b,{transform:'translate(0 -58)'}); set(g,{transform:`scale(${sc})`}); return g;}
/* 64-team bracket (lines), revealed by p in round order */
function bracket(parent,x0,x1,y0,y1){const g=sv('g',{},parent),L=[];const cw=(x1-x0)/12;
  for(const side of [0,1]){for(let r=0;r<6;r++){const n=32>>r, h=(y1-y0)/n;
    for(let i=0;i<n;i++){const y=y0+h*(i+.5), xa=side?x1-r*cw:x0+r*cw, xb=side?xa-cw:xa+cw;
      L.push({e:sv('line',{x1:xa,y1:y,x2:xb,y2:y,stroke:'#3A3A44','stroke-width':3},g),r});
      if(i%2==0&&r<5){const y2=y0+h*(i+1.5); L.push({e:sv('line',{x1:xb,y1:y,x2:xb,y2:y2,stroke:'#3A3A44','stroke-width':3},g),r});}}}}
  const ctr=sv('rect',{x:(x0+x1)/2-cw*.9,y:(y0+y1)/2-28,width:cw*1.8,height:56,rx:10,fill:'none',stroke:'#0CF5F9','stroke-width':4},g);
  return {g,L,ctr,draw(p){L.forEach(l=>{const q=clamp(p*6-l.r);set(l.e,{opacity:q>0?1:0,stroke:q>=1&&l.r<1?'#55555F':'#3A3A44'});}); set(ctr,{opacity:clamp(p*6-5.5)*2});}};}

/* ===================== chapters ===================== */
const NL=ab=>`logos/nfl-${ab.toLowerCase()==="oak"?"lv":ab.toLowerCase()}.png`;
const nlH=(ab,sz)=>`<img class="lg" src="${NL(ab)}" style="width:${sz}px;height:${sz}px">`;
const CUT=[0, C(10)-.05, C(17)-.05, C(21)-.05, C(26)-.05, C(33)-.05, C(39)-.05, C(44)-.05, C(52)-.05];
const END=101.75;
const T={end:END};
const HDR=[null,
 ['01','Every team gets a score.','it’s called Elo · like a chess rating'],
 ['02','Replay every season.','every game at its real odds · real playoff rules'],
 ['03','Is it honest?','14,321 games · 1966–2025'],
 ['04','100,000 histories.','playoff trips per 60 seasons'],
 ['05','Super Bowls.','appearances per 60-season history'],
 ['06','The best shot.','chance to make the Super Bowl · each season'],
 ['07','The curse is real.','all 17 Lions playoff games since 1966'],
 ['08','The verdict.','']];
const chs=document.getElementById('chs');
const prg=document.getElementById('prog'); for(let i=0;i<8;i++){const x=document.createElement('i');prg.appendChild(x);}
const CH=[]; for(let i=0;i<CUT.length;i++){const d=div('ch','',chs);CH.push(d);
  if(HDR[i]){const h=div('hdr',`<div class="n">${HDR[i][0]}</div><div class="t">${HDR[i][1]}</div><div class="s">${HDR[i][2]}</div>`,d);d._h=h;}
  const s=sv('svg',{width:1080,height:1920,viewBox:'0 0 1080 1920',style:'position:absolute;left:0;top:0'});d.appendChild(s);d._svg=s;}
CUT.slice(1).forEach(c=>{sfx(c-.18,'whip',.55);});
const hdrIn=(k,t)=>fadeUp(CH[k]._h,t,CUT[k]+.05,.3);
const YRS=DATA.yr.map(x=>x[0]);
function tiles(parent,x0,y0,cw=96,ch=60){const T=[];YRS.forEach((y,i)=>{const d=div('abs osw','',parent,{left:(x0+(i%10)*cw)+'px',top:(y0+Math.floor(i/10)*ch)+'px',width:(cw-8)+'px',height:(ch-8)+'px',borderRadius:'8px',background:'#1A1A20',fontSize:'22px',display:'flex',alignItems:'center',justifyContent:'center',color:'#8E8E96'}); d.textContent="’"+String(y).slice(2); T.push(d);});return T;}
const REALPO=new Set(DATA.po.map(g=>g.s));

/* ---------- 0 HOOK ---------- */
const H=CH[0], Hs=H._svg;
const hCirc=div('abs','',H,{left:'300px',top:'700px',width:'660px',height:'660px',borderRadius:'50%',background:'#0076B6',boxShadow:'inset 0 0 0 12px #B0B7BC'});
const hWm=div('abs','',H,{left:'420px',top:'820px',width:'420px',height:'420px',background:`url(${NL('det')}) center/contain no-repeat`,opacity:.18});
const hSt=div('abs','',H,{left:'330px',top:'640px',width:'620px',height:'725px',background:'url(img/st_hutch.png) center bottom/contain no-repeat'});
const h1=div('abs big','DETROIT LIONS:<br><span class="cy">0 SUPER BOWLS.</span>',H,{left:'54px',top:'292px',fontSize:'118px'});
const h1s=div('abs osw','not once in <span class="cy">60 seasons</span>',H,{left:'58px',top:'545px',fontSize:'40px'});
const hDet=div('abs','',H,{left:'50px',top:'760px'}); hDet.innerHTML=nlH('det',190);
const hMk=div('abs mk cy','since 1966',H,{left:'50px',top:'980px',fontSize:'60px'});
const hSB=div('abs','',H,{left:'60px',top:'1110px'}); hSB.innerHTML='<div class="big rd" style="font-size:110px;line-height:1">0</div><div class="osw" style="font-size:26px;letter-spacing:2px">SUPER BOWL<br>TRIPS</div>';
// B: I simulated ... 100,000 times / cursed?
const hB=div('abs big','I SIMULATED<br>THEIR HISTORY<br><span class="cy">100,000 TIMES.</span>',H,{left:'54px',top:'292px',fontSize:'112px'});
const tB=tiles(H,60,720); const hBq=div('pill','CURSED?',H,{left:'380px',top:'1130px',background:'var(--rd)',color:'#fff',fontSize:'60px'});
// C: 39%
const hC=div('abs big cy','39%',H,{left:'54px',top:'300px',fontSize:'300px'});
const hCs=div('abs osw','of simulated histories: <span class="rd">still 0 Super Bowls</span>',H,{left:'60px',top:'620px',fontSize:'40px'});
const dotsG=sv('g',{},Hs); const DOTS=[]; {const R=rng(7); const idx=[...Array(100).keys()].sort(()=>R()-.5).slice(0,39);
 for(let i=0;i<100;i++){const c=sv('circle',{cx:150+(i%10)*86,cy:760+Math.floor(i/10)*62,r:24,fill:'#2A2A31'},dotsG);DOTS.push({c,hit:idx.includes(i),k:idx.indexOf(i)});}}
// D: not cursed / except
const hD=div('abs big','SO NO.<br>NOT <span class="cy">CURSED.</span>',H,{left:'54px',top:'300px',fontSize:'150px'});
const hE=div('pill','EXCEPT FOR ONE THING…',H,{left:'90px',top:'640px',background:'var(--rd)',color:'#fff',fontSize:'50px'});
const hCJ=div('abs','',H,{left:'360px',top:'760px',width:'640px',height:'690px',background:'url(img/st_cj.png) center bottom/contain no-repeat'});
const hDl=div('abs','',H,{left:'300px',top:'760px'}); hDl.innerHTML=nlH('det',480);
function rHook(t){
  const a=t<C(3)-.05; show([hCirc,hWm,hSt,h1,h1s,hDet,hMk,hSB],a);
  if(a){const pc=back(prog(t,.02,.42)); hCirc.style.transform=`scale(${Math.max(0,pc)})`; hWm.style.transform=hCirc.style.transform; hWm.style.opacity=.18*prog(t,.2,.5);
    const ps=eOut(prog(t,.12,.6)); hSt.style.transform=`translateY(${(1-ps)*420}px) scale(${1+t*.012})`; hSt.style.opacity=ps>0?1:0;
    fadeUp(h1,t,.05,.3,40); fadeUp(h1s,t,C(2)-.05,.3); popIn(hDet,t,.6,{from:.3}); popIn(hMk,t,C(2)+.3,{from:1.3}); hMk.style.transform+=' rotate(-7deg)'; popIn(hSB,t,C(1)+.6,{from:1.5});}
  const b=t>=C(3)-.05&&t<C(5)-.05; show([hB,hBq,...tB],b);
  if(b){fadeUp(hB,t,C(3)-.05,.3); tB.forEach((d,i)=>{popIn(d,t,C(3)+.2+i*.03,{from:.3}); const lit=t>=C(3)+1.6+i*.02&&REALPO.has(YRS[i]); d.style.background=lit?'#0076B6':'#1A1A20'; d.style.color=lit?'#fff':'#8E8E96';});
    hBq.style.display=t>=C(4)+.6?'block':'none'; popIn(hBq,t,WT('cursed',C(4))-.05,{from:1.5});}
  const c=t>=C(5)-.05&&t<C(7)-.05; show([hC,hCs],c); dotsG.style.display=c?'inline':'none';
  if(c){popIn(hC,t,C(5)-.05,{from:1.2}); hC.textContent=Math.round(39*eOut(prog(t,C(5),C(5)+.8)))+'%'; fadeUp(hCs,t,C(5)+.25);
    DOTS.forEach((d,i)=>{set(d.c,{opacity:prog(t,C(5)+.05+i*.006,C(5)+.15+i*.006)}); if(d.hit){const hp=prog(t,C(6)-.1+d.k*.025,C(6)+.05+d.k*.025); set(d.c,{fill:hp>0?'#FF4B3E':'#2A2A31',r:24+6*(1-hp)*(hp>0)});}});}
  const d=t>=C(7)-.05; show([hD,hDl],d&&t<C(8)-.05); show([hE,hCJ],d&&t>=C(8)-.05);
  if(d){popIn(hD,t,C(7)-.05,{from:1.15}); popIn(hDl,t,C(7)+.2,{from:.3});
    popIn(hE,t,C(8)-.05,{from:1.2}); const ps=eOut(prog(t,C(8),C(8)+.4)); hCJ.style.transform=`translateX(${(1-ps)*600}px) scale(${1+(t-C(8))*.01})`;
    if(t>=C(8)-.05){hD.style.display='block'; hD.style.opacity=.25;}}
}
sfx(.05,'whoosh',.5); sfx(.25,'thump',.6); sfx(.6,'pop',.45); sfx(C(1)+.6,'thump',.7); sfx(C(2)+.3,'pop',.4);
sfx(C(3)-.05,'whoosh',.5); for(let i=0;i<12;i++)sfx(C(3)+.2+i*.15,'click',.2); sfx(WT('cursed',C(4))-.05,'thump',.6);
sfx(C(5)-.05,'thump',.7); for(let i=0;i<20;i++)sfx(C(6)-.1+i*.05,'click',.2); sfx(C(7)-.05,'whoosh',.45); sfx(C(8)-.05,'thump',.8); sfx(C(8),'whoosh',.4);

/* ---------- 1 ELO ---------- */
const E1=CH[1], S1=E1._svg; const yr=DATA.yr;
const cx0=130,cx1=960,cy0=1250,cy1=640,ymn=1200,ymx=1760;
const ex=i=>cx0+i*(cx1-cx0)/(yr.length-1), ey=e=>cy0-(e-ymn)/(ymx-ymn)*(cy0-cy1);
const ax1=sv('g',{},S1);
[1300,1500,1700].forEach(v=>{sv('line',{x1:cx0,x2:cx1,y1:ey(v),y2:ey(v),stroke:'#1E1E24','stroke-width':2},ax1);const tx=sv('text',{x:cx0-14,y:ey(v)+8,'text-anchor':'end','font-size':24,fill:'#6A6A72'},ax1);tx.textContent=v;});
[1966,1980,1995,2010,2025].forEach(y=>{const i=YRS.indexOf(y);const tx=sv('text',{x:ex(i),y:cy0+44,'text-anchor':'middle','font-size':24,fill:'#6A6A72'},ax1);tx.textContent=y;});
const eLab=div('abs osw',`${nlH('det',84)} <span style="vertical-align:middle">LIONS · TEAM RATING BY SEASON</span>`,E1,{left:'120px',top:'520px',fontSize:'34px',letterSpacing:'1.5px'});
const eline=sv('path',{fill:'none',stroke:'#0076B6','stroke-width':8,'stroke-linecap':'round','stroke-linejoin':'round'},S1);
const edot=sv('circle',{r:12,fill:'#fff'},S1);
const pUp=div('pill','WIN → ▲',E1,{left:'130px',top:'1320px',background:'var(--cy)',color:'#050506',fontSize:'36px'});
const pDn=div('pill','LOSE → ▼',E1,{left:'420px',top:'1320px',background:'var(--rd)',color:'#fff',fontSize:'36px'});
const i09=YRS.indexOf(2009), i24=YRS.indexOf(2024);
const low=sv('circle',{cx:ex(i09),cy:ey(yr[i09][1]),r:22,fill:'none',stroke:'#FF4B3E','stroke-width':6},S1);
const lowT=div('abs','',E1,{left:(ex(i09)-190)+'px',top:'1312px',width:'380px',textAlign:'center'}); lowT.innerHTML='<span class="big rd" style="font-size:84px;vertical-align:middle">0-16</span> <span class="osw" style="font-size:26px;vertical-align:middle">IN 2008</span>';
const hi=sv('circle',{cx:ex(i24),cy:ey(yr[i24][1]),r:22,fill:'none',stroke:'#0CF5F9','stroke-width':6},S1);
const hiT=div('abs','',E1,{left:(ex(i24)-250)+'px',top:(ey(yr[i24][1])-95)+'px',width:'260px',textAlign:'right'}); hiT.innerHTML='<div class="big cy" style="font-size:64px">PEAK ’24</div>';
function linePts(p){const n=Math.max(1,Math.floor(p*(yr.length-1))); let d=''; for(let i=0;i<=n;i++)d+=(i?'L':'M')+ex(i)+','+ey(yr[i][1]); return {d,i:n};}
function rElo(t){hdrIn(1,t); fadeUp(eLab,t,CUT[1]+.15); set(ax1,{opacity:prog(t,CUT[1]+.1,CUT[1]+.4)});
  const lp=linePts(eIO(prog(t,CUT[1]+.3,C(14)-.3))); set(eline,{d:lp.d}); set(edot,{cx:ex(lp.i),cy:ey(yr[lp.i][1])});
  show([pUp],t>=C(12)-.05&&t<C(14)); popIn(pUp,t,C(12)-.05,{from:.5}); show([pDn],t>=C(13)-.05&&t<C(14)); popIn(pDn,t,C(13)-.05,{from:.5});
  low.style.display=t>=C(14)?'inline':'none'; set(low,{r:22+10*(1-eOut(prog(t,C(14),C(14)+.3)))}); show([lowT],t>=C(15)-.05); popIn(lowT,t,C(15)-.05,{from:1.4});
  hi.style.display=t>=C(16)?'inline':'none'; set(hi,{r:22+10*(1-eOut(prog(t,C(16),C(16)+.3)))}); show([hiT],t>=C(16)); popIn(hiT,t,C(16),{from:1.3});
  E1.style.transform=`scale(${1+(t-CUT[1])*.002})`;}
sfx(CUT[1]+.3,'riser',.3,2.5); sfx(C(12)-.05,'pop',.5); sfx(C(13)-.05,'pop',.5); sfx(C(14),'thump',.6); sfx(C(15)-.05,'thump',.75); sfx(C(16),'ding',.35);
